services:
  db:
    image: mysql:8.0
    container_name: short-video-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-short_video_password}
      MYSQL_DATABASE: short_video_platform
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
      - ./database/indexes.sql:/docker-entrypoint-initdb.d/02_indexes.sql:ro
      - ./database/procedures.sql:/docker-entrypoint-initdb.d/03_procedures.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/04_seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build: .
    container_name: short-video-web
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_USER: root
      DB_PASSWORD: ${MYSQL_ROOT_PASSWORD:-short_video_password}
      DB_NAME: short_video_platform
      SECRET_KEY: ${SECRET_KEY:-docker-dev-secret-change-me}
      BACKUP_DIR: /app/database/backup
    ports:
      - "5000:5000"

volumes:
  mysql_data:
